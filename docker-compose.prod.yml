services:
  prod:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod 
    container_name: idea-prod
    ports:
      - "443:443"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ./src:/work/app/src
      - ./certificates:/work/app/certificates
      - ./config:/work/app/config
      - ./seeders:/work/app/seeders
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8
    container_name: idea-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - network
    restart: unless-stopped

  redis:
    container_name: redis-prod
    image: "redis:alpine"
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAX_MEMORY: ${REDIS_MAX_MEMORY}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "${REDIS_MAX_MEMORY}", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - network
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:

networks:
  network:
    driver: bridge